name: UI

on:
    pull_request:
        paths:
            - "**.css"
            - "**.js"
            - "**.ts"
            - "**.tsx"
            - "**.php"
            - "**.svg"

jobs:
    prettier:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.head_ref }}
                  token: ${{ secrets.GH_TOKEN }}

            # PHP & Composer are required to load tailwind.config.js which depends on
            # ./vendor/arkecosystem/foundation/resources/tailwind.config.js
            # prettier-plugin-tailwindcss needs access to the tailwind config to sort class names
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.5"
                  extensions: mbstring, dom, fileinfo, intl, gd, imagick, bcmath, soap, zip, sqlite, pcov

            - name: Cache Composer dependencies
              uses: actions/cache@v4
              with:
                  path: ~/.composer/cache/files
                  key: dependencies-composer-${{ hashFiles('composer.json') }}

            - name: Install Composer dependencies
              run: composer install --no-ansi --no-interaction --no-suggest --no-progress --prefer-dist --optimize-autoloader --ignore-platform-reqs

            - uses: actions/setup-node@v4
              with:
                  node-version: 24.15

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Install pnpm dependencies
              run: pnpm i --frozen-lockfile

            - name: Run prettier
              run: pnpm prettier --write 'resources/**/*.{css,js,ts,tsx}'

            - uses: stefanzweifel/git-auto-commit-action@v5
              with:
                  commit_message: "style: resolve style guide violations"
                  branch: ${{ github.head_ref }}

    svg:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.head_ref }}
                  token: ${{ secrets.GH_TOKEN }}

            - uses: actions/setup-node@v4
              with:
                  node-version: 24.15

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Install pnpm dependencies
              run: pnpm i --frozen-lockfile

            - name: Optimize SVGs
              id: svgo
              run: |
                  export PATH="$(pnpm global bin):$PATH"
                  pnpm add -g svgo@latest
                  pnpm svgo --config .svgo.js ./resources/**/*.svg

            - name: Commit optimizations
              uses: stefanzweifel/git-auto-commit-action@v5
              with:
                  commit_message: Optimize SVG(s)

    build:
        needs: [prettier, svg]

        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.head_ref }}
                  token: ${{ secrets.GH_TOKEN }}

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.5"
                  extensions: mbstring, dom, fileinfo, intl, gd, imagick, bcmath, soap, zip, sqlite, pcov
                  coverage: pcov

            - name: Cache dependencies
              uses: actions/cache@v4
              with:
                  path: ~/.composer/cache/files
                  key: dependencies-composer-${{ hashFiles('composer.json') }}

            - name: Install Composer dependencies
              run: composer install --no-ansi --no-interaction --no-suggest --no-progress --prefer-dist --optimize-autoloader --ignore-platform-reqs

            - uses: actions/setup-node@v4
              with:
                  node-version: 24.15

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Install pnpm dependencies
              run: pnpm i --frozen-lockfile

            - name: Build
              run: pnpm build
